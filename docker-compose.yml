version: '3.9'

services:
  nodemap:
    build:
      context: .
      dockerfile: Dockerfile
    image: nodemap:latest
    container_name: nodemap
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      # AI providers — set at least one
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Optional overrides
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/uploads
      STATIC_DIR: /app/public
    volumes:
      # Persist the sql.js database and uploaded/analysed repos across restarts
      - nodemap-data:/app/data
      - nodemap-uploads:/app/uploads

volumes:
  nodemap-data:
  nodemap-uploads:
